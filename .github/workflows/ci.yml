name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint (eslint + fronteira modular)
        run: npm run lint
      - name: Boot smoke (a API sobe?)
        run: |
          node src/server.js &
          sleep 4
          curl -fsS http://localhost:4000/api/health
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: dummy-para-boot
      - name: Test (suíte de dinheiro — roda contra o Supabase de TESTE)
        run: npm test
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}

  # ═══════════════════════════════════════════════════════════
  # E2E — as 13 áreas contra uma API de verdade.
  #
  # Existe porque o job acima cobre só os invariantes de dinheiro: bilheteria,
  # portaria, reentrada, fila, fiscal, split e subcontas passavam verdes sem
  # ninguém rodar uma linha delas. Um push podia entrar com metade do produto
  # quebrada.
  #
  # Precisa de banco de verdade. Sem os segredos configurados o job AVISA e
  # passa, em vez de ficar vermelho eternamente em fork ou PR de fora — CI que
  # falha por motivo estrutural vira ruído e as pessoas param de olhar.
  # ═══════════════════════════════════════════════════════════
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci

      - name: Os segredos estão configurados?
        id: cofre
        run: |
          if [ -n "${{ secrets.TEST_SUPABASE_URL }}" ] \
          && [ -n "${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}" ] \
          && [ -n "${{ secrets.TEST_SUPABASE_ANON_KEY }}" ]; then
            echo "tem=sim" >> "$GITHUB_OUTPUT"
          else
            echo "tem=nao" >> "$GITHUB_OUTPUT"
          fi

      - name: E2E (13 áreas · semeia o cenário e sobe a API)
        if: steps.cofre.outputs.tem == 'sim'
        run: npm run test:e2e
        env:
          PORT: 4000
          NODE_ENV: test
          SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          # Token fixo: as suítes de pagamento assinam o webhook com ele.
          ASAAS_WEBHOOK_TOKEN: e2e-webhook-token
          # Sandbox de propósito — nenhuma suíte pode encostar em conta real.
          ASAAS_BASE_URL: https://api-sandbox.asaas.com/v3
          SECRET_BOX_KEY: e2e-chave-de-teste-nao-usar-em-producao
          TICKET_QR_SECRET: e2e-qr-secret

      - name: Sem segredos — o que falta
        if: steps.cofre.outputs.tem != 'sim'
        run: |
          echo "::warning title=E2E não rodou::Configure os segredos do repositório para ligar as 13 áreas."
          echo "Faltam um ou mais destes em Settings → Secrets and variables → Actions:"
          echo "  TEST_SUPABASE_URL"
          echo "  TEST_SUPABASE_SERVICE_ROLE_KEY"
          echo "  TEST_SUPABASE_ANON_KEY"
          echo ""
          echo "Use um projeto Supabase SEPARADO do de produção: a semeadura apaga e recria o cenário."

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -t pulsepass-api:ci .
